name: Site checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.148.0" # keep in sync with netlify.toml
      HUGO_ENV: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          curl -sSL -o "$RUNNER_TEMP/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build site (fail on any Hugo warning)
        working-directory: KrakenBrewing
        run: hugo --panicOnWarning -d "$RUNNER_TEMP/site"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check content and built site
        run: |
          pip install pyyaml
          python tests/check_site.py "$RUNNER_TEMP/site"
