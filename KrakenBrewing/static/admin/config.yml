backend:
  name: git-gateway
  branch: master # Branch to update (optional; defaults to master)

publish_mode: editorial_workflow

media_folder: "/KrakenBrewing/static/img" # Media files will be stored in the repo under images/uploads
public_folder: "/img" # The src attribute for uploaded media will begin with /images/uploads

collections:
  - name: "post" # Used in routes, e.g., /admin/collections/blog
    label: "post" # Used in the UI
    folder: "/KrakenBrewing/content/post" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Description", name: "description", widget: "text", required: false, hint: "One or two sentences for Google results and link previews."}
      - {label: "Share image", name: "share_img", widget: "image", required: false, hint: "Picture shown when the post is shared on social media."}
      - {label: "Tags", name: "tags", widget: "list", hint: "Comma-separated, e.g. NEIPA, hazy, all-grain"}
      - {label: "Body", name: "body", widget: "markdown"}